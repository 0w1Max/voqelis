name: CI

on:
  push:
    branches:
      - feature/planner-v1
  pull_request:
    branches:
      - feature/planner-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          python -m ruff check --isolated --fix src tests || true
          git diff -- src tests
          python -m ruff check --isolated src tests
      - name: Compile
        run: python -m compileall -q src tests planner_ai_benchmark.py
      - name: Pytest
        run: pytest -q
      - name: Benchmark smoke test
        run: python planner_ai_benchmark.py --help
