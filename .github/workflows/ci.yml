name: CI

on:
  push:
    branches:
      - feature/planner-v1
      - refactor/asr-punctuation
  pull_request:
    branches:
      - feature/planner-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          # UP017/UP041 prefer Python 3.11+ aliases; Voqelis also supports Python 3.10.
          python -m ruff check --isolated --ignore UP017,UP041 src tests
      - name: Compile
        run: python -m compileall -q src tests planner_ai_benchmark.py
      - name: Pytest
        run: pytest -q
      - name: Benchmark smoke test
        run: PYTHONPATH=src python planner_ai_benchmark.py --help
