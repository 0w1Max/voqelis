[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "voqelis"
version = "0.2.0"
description = "Local-first Telegram voice-to-text and AI-ready processing bot powered by faster-whisper"
requires-python = ">=3.10,<3.15"
dependencies = [
    "aiogram==3.31.0",
    "av==18.1.0",
    "faster-whisper==1.2.1",
    "python-dotenv==1.2.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
